# StudyThinker local development stack.
#
#   Infra only (recommended while developing the apps on the host):
#     pnpm infra:up
#
#   Full stack (postgres + api + web in containers):
#     pnpm stack:up
name: learnwell

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: learnwell
      POSTGRES_PASSWORD: learnwell
      POSTGRES_DB: learnwell
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U learnwell -d learnwell']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ['apps']
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../../apps/api/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://learnwell:learnwell@postgres:5432/learnwell?schema=public
      WEB_ORIGIN: http://localhost:3000
      RUN_MIGRATIONS: 'true'
      # Local production build over plain http: downgrades the production safety checks
      # (secure cookies, real email, non-localhost origin) to warnings. Never use in a real deployment.
      ALLOW_INSECURE_LOCAL_PRODUCTION: 'true'
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ['apps']
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres-data:
